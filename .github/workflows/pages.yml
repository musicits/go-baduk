# docs/ 폴더를 GitHub Pages 로 올린다.
# configure-pages 의 enablement 가 Pages 를 알아서 켜주므로
# 저장소 설정을 손으로 건드릴 필요가 없다.
name: 웹에 올리기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 배포
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Pages 준비 (꺼져 있으면 켠다)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: docs 폴더 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 배포
        id: deploy
        uses: actions/deploy-pages@v4

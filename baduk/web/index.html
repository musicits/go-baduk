<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바둑</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23dcb35c'/%3E%3Ccircle cx='12' cy='12' r='7' fill='%23141010'/%3E%3Ccircle cx='21' cy='21' r='7' fill='%23f7f4ec'/%3E%3C/svg%3E">
<style>
  :root {
    --판: #dcb35c; --줄: #4a3722; --글자: #2b2118; --바탕: #f4efe6;
    --카드: #fffdf8; --테두리: #e0d6c4; --강조: #7b4b2a; --흐림: #857a68;
  }
  @media (prefers-color-scheme: dark) {
    :root { --바탕:#17140f; --카드:#221d16; --글자:#efe7d8; --테두리:#3a3227; --흐림:#a2977f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; background: var(--바탕); color: var(--글자);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic",
                 "Noto Sans KR", sans-serif;
    display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
    align-items: flex-start;
  }
  h1 { font-size: 20px; margin: 0 0 12px; letter-spacing: 2px; }
  #판 { border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.25); cursor: pointer;
        touch-action: manipulation; max-width: 100%; }
  aside { width: 300px; max-width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .카드 { background: var(--카드); border: 1px solid var(--테두리);
          border-radius: 10px; padding: 14px; }
  .줄 { display: flex; justify-content: space-between; align-items: center;
        padding: 4px 0; font-size: 14px; }
  .줄 b { font-weight: 600; }
  .흐림 { color: var(--흐림); font-size: 12px; line-height: 1.6; }
  button { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px;
           border: 1px solid var(--테두리); background: var(--카드);
           color: var(--글자); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--강조); }
  button:disabled { opacity: .45; cursor: default; }
  button.주 { background: var(--강조); color: #fff; border-color: var(--강조); }
  .단추들 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label { display: flex; justify-content: space-between; align-items: center;
          gap: 8px; font-size: 13px; padding: 5px 0; }
  select, input[type=number] { font: inherit; font-size: 13px; padding: 5px;
          border-radius: 6px; border: 1px solid var(--테두리);
          background: var(--바탕); color: var(--글자); min-width: 110px; }
  .돌표시 { display: inline-block; width: 13px; height: 13px; border-radius: 50%;
            vertical-align: -2px; margin-right: 6px; border: 1px solid #6b5a3e; }
  .흑돌 { background: #14100c; } .백돌 { background: #f7f4ec; }
  #알림 { font-size: 13px; min-height: 20px; color: var(--강조); font-weight: 600; }
  #막대 { height: 8px; border-radius: 4px; overflow: hidden; display: flex;
          background: #f7f4ec; border: 1px solid var(--테두리); }
  #막대 i { display: block; background: #14100c; height: 100%; transition: width .3s; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: right; padding: 3px 2px; }
  th:first-child, td:first-child { text-align: left; font-weight: 600; }
  thead th { color: var(--흐림); font-weight: 500; border-bottom: 1px solid var(--테두리); }
  details summary { cursor: pointer; font-size: 13px; }
</style>
</head>
<body>

<main>
  <h1>바 둑</h1>
  <canvas id="판" width="640" height="640"></canvas>
</main>

<aside>
  <div class="카드">
    <div id="알림">불러오는 중…</div>
    <div id="막대"><i style="width:50%"></i></div>
    <div class="줄"><span><i class="돌표시 흑돌"></i>흑</span><b id="흑정보">–</b></div>
    <div class="줄"><span><i class="돌표시 백돌"></i>백</span><b id="백정보">–</b></div>
    <div class="줄"><span>수순</span><b id="수순">0</b></div>
    <div class="줄"><span>덤 · 규칙</span><b id="덤">–</b></div>
  </div>

  <div class="카드 단추들">
    <button id="패스">패스</button>
    <button id="무르기">무르기</button>
    <button id="분석">분석</button>
    <button id="계가">계가</button>
    <button id="기보저장">기보 저장</button>
    <button id="기보열기">기보 열기</button>
    <button id="돌던지기">돌 던지기</button>
    <button id="새대국" class="주">새 대국</button>
    <input type="file" id="파일" accept=".sgf" hidden>
  </div>

  <details class="카드" id="설정칸" open>
    <summary>대국 설정</summary>
    <label>판 크기
      <select id="크기"><option>19</option><option>13</option><option>9</option></select>
    </label>
    <label>상대
      <select id="엔진">
        <option value="auto">자동 (KataGo 있으면 사용)</option>
        <option value="katago">KataGo</option>
        <option value="내장">내장 봇 (아주 약함)</option>
      </select>
    </label>
    <label>내 색
      <select id="내색"><option value="흑">흑 (먼저)</option><option value="백">백</option></select>
    </label>
    <label>접바둑 <select id="접바둑">
      <option value="0">없음</option><option>2</option><option>3</option>
      <option>4</option><option>5</option><option>6</option>
      <option>7</option><option>8</option><option>9</option></select></label>
    <label>계가 방식
      <select id="규칙"><option>중국</option><option>일본</option></select>
    </label>
    <label>한 수 생각 <input type="number" id="생각시간" value="5" min="1" max="60" step="1"> </label>
  </details>

  <div class="카드" id="분석칸" hidden>
    <div class="줄"><span>승률 (흑)</span><b id="승률">–</b></div>
    <table>
      <thead><tr><th>후보</th><th>승률</th><th>예상집</th><th>방문</th></tr></thead>
      <tbody id="후보"></tbody>
    </table>
  </div>

  <div class="카드 흐림" id="엔진칸"></div>
</aside>

<script>
"use strict";
const 판 = document.getElementById("판");
const 그림 = 판.getContext("2d");
let 상태 = null, 크기 = 19, 생각중 = false, 후보수 = [];

// ---------------------------------------------------------------- 통신
async function 요청(주소, 몸통) {
  const 설정 = 몸통 === undefined
    ? {}
    : { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(몸통) };
  const 응답 = await fetch(주소, 설정);
  const 자료 = await 응답.json();
  if (!응답.ok) throw new Error(자료.오류 || "요청이 실패했습니다");
  return 자료;
}

async function 보내기(주소, 몸통) {
  if (생각중) return;
  생각중 = true;
  알림("두는 중…");
  잠금(true);
  try {
    상태 = await 요청(주소, 몸통 || {});
    후보수 = 상태.분석 || [];
    그리기();
    갱신();
  } catch (오류) {
    알림(오류.message);
  } finally {
    생각중 = false;
    잠금(false);
  }
}

function 잠금(값) {
  document.querySelectorAll("button").forEach(b => b.disabled = 값);
}

// ---------------------------------------------------------------- 그리기
function 여백() { return 판.width / (크기 + 1); }

function 그리기() {
  const 폭 = 판.width, 칸 = 여백();
  그림.fillStyle = "#dcb35c";
  그림.fillRect(0, 0, 폭, 폭);

  그림.strokeStyle = "rgba(74,55,34,.85)";
  그림.lineWidth = 1;
  그림.font = `${Math.max(9, 칸 * 0.34)}px sans-serif`;
  그림.fillStyle = "rgba(74,55,34,.75)";
  그림.textAlign = "center";
  그림.textBaseline = "middle";
  const 글자 = "ABCDEFGHJKLMNOPQRSTUVWXYZ";

  for (let i = 0; i < 크기; i++) {
    const 자리 = 칸 * (i + 1);
    그림.beginPath();
    그림.moveTo(칸, 자리); 그림.lineTo(폭 - 칸, 자리);
    그림.moveTo(자리, 칸); 그림.lineTo(자리, 폭 - 칸);
    그림.stroke();
    그림.fillText(글자[i], 자리, 칸 * 0.45);
    그림.fillText(String(크기 - i), 칸 * 0.45, 자리);
  }

  화점().forEach(([r, c]) => {
    그림.beginPath();
    그림.fillStyle = "rgba(74,55,34,.9)";
    그림.arc(칸 * (c + 1), 칸 * (r + 1), Math.max(2, 칸 * 0.09), 0, 7);
    그림.fill();
  });

  if (!상태) return;
  const 반지름 = 칸 * 0.46;
  for (let i = 0; i < 상태.돌.length; i++) {
    const 돌 = 상태.돌[i];
    if (!돌) continue;
    const r = Math.floor(i / 크기), c = i % 크기;
    돌그리기(칸 * (c + 1), 칸 * (r + 1), 반지름, 돌 === 1);
  }

  if (상태.마지막수) {
    const [r, c] = 상태.마지막수;
    그림.beginPath();
    그림.strokeStyle = 상태.돌[r * 크기 + c] === 1 ? "#f0e6d2" : "#2a2018";
    그림.lineWidth = 2;
    그림.arc(칸 * (c + 1), 칸 * (r + 1), 반지름 * 0.45, 0, 7);
    그림.stroke();
  }

  // 엔진이 추천한 후보수를 옅게 표시한다.
  후보수.slice(0, 5).forEach((후보, 번호) => {
    const 점 = 좌표풀기(후보.수);
    if (!점) return;
    그림.beginPath();
    그림.fillStyle = 번호 === 0 ? "rgba(60,140,90,.55)" : "rgba(60,110,160,.32)";
    그림.arc(칸 * (점[1] + 1), 칸 * (점[0] + 1), 반지름 * 0.82, 0, 7);
    그림.fill();
    그림.fillStyle = "#fff";
    그림.font = `bold ${Math.max(9, 칸 * 0.3)}px sans-serif`;
    그림.fillText(Math.round((후보.승률 || 0) * 100), 칸 * (점[1] + 1), 칸 * (점[0] + 1));
  });
}

function 돌그리기(x, y, 반지름, 흑) {
  그림.beginPath();
  그림.arc(x + 1, y + 2, 반지름, 0, 7);
  그림.fillStyle = "rgba(0,0,0,.28)";
  그림.fill();

  const 빛 = 그림.createRadialGradient(
    x - 반지름 * .35, y - 반지름 * .4, 반지름 * .1, x, y, 반지름);
  if (흑) { 빛.addColorStop(0, "#585048"); 빛.addColorStop(1, "#0d0b09"); }
  else { 빛.addColorStop(0, "#ffffff"); 빛.addColorStop(1, "#d8d1c2"); }
  그림.beginPath();
  그림.arc(x, y, 반지름, 0, 7);
  그림.fillStyle = 빛;
  그림.fill();
}

function 화점() {
  if (크기 < 7) return [];
  const 끝 = 크기 >= 13 ? 3 : 2, 가운데 = (크기 - 1) / 2, 먼 = 크기 - 1 - 끝;
  const 점 = [[끝,끝],[끝,먼],[먼,끝],[먼,먼]];
  if (크기 % 2 === 1) {
    점.push([가운데, 가운데]);
    if (크기 >= 13) 점.push([끝,가운데],[먼,가운데],[가운데,끝],[가운데,먼]);
  }
  return 점;
}

function 좌표풀기(글) {
  if (!글 || 글.toLowerCase() === "pass") return null;
  const 표 = "ABCDEFGHJKLMNOPQRSTUVWXYZ";
  const c = 표.indexOf(글[0].toUpperCase());
  const 수 = parseInt(글.slice(1), 10);
  if (c < 0 || isNaN(수)) return null;
  return [크기 - 수, c];
}

// ---------------------------------------------------------------- 화면 갱신
function 알림(글) { document.getElementById("알림").textContent = 글; }

function 갱신() {
  if (!상태) return;
  크기 = 상태.크기;
  const 내색 = 상태.사람 === 1 ? "흑" : "백";
  document.getElementById("수순").textContent = 상태.수순;
  document.getElementById("덤").textContent = `${상태.덤} · ${상태.규칙}식`;
  document.getElementById("흑정보").textContent =
    `${상태.사람 === 1 ? "나" : 상태.엔진이름} · ${상태.따낸돌.흑}점`;
  document.getElementById("백정보").textContent =
    `${상태.사람 === 2 ? "나" : 상태.엔진이름} · ${상태.따낸돌.백}점`;

  if (상태.끝남) {
    알림(`대국 종료 — ${상태.결과 || ""}`);
  } else {
    알림(상태.차례 === 상태.사람 ? `내 차례 (${내색})` : `${상태.엔진이름} 차례`);
  }

  const 승률 = 후보수.length ? 후보수[0].승률 : null;
  const 흑승률 = 승률 == null ? null
    : (상태.차례 === 1 ? 승률 : 1 - 승률);
  document.getElementById("막대").firstElementChild.style.width =
    ((흑승률 == null ? 0.5 : 흑승률) * 100) + "%";

  const 분석칸 = document.getElementById("분석칸");
  분석칸.hidden = !후보수.length;
  if (후보수.length) {
    document.getElementById("승률").textContent =
      `${(흑승률 * 100).toFixed(1)}%`;
    document.getElementById("후보").innerHTML = 후보수.map(후 => `
      <tr><td>${후.수}</td>
      <td>${후.승률 == null ? "–" : (후.승률 * 100).toFixed(1) + "%"}</td>
      <td>${후.예상집 == null ? "–" : 후.예상집.toFixed(1)}</td>
      <td>${후.방문수}</td></tr>`).join("");
  }

  const 현황 = 상태.엔진현황 || {};
  document.getElementById("엔진칸").innerHTML =
    (현황.KataGo && 현황.KataGo.설치됨
      ? `KataGo 사용 중<br>${현황.KataGo.신경망 || "기본 신경망"}`
      : `KataGo 가 없어 <b>내장 봇</b>으로 둡니다 (아주 약함).<br>
         README 의 KataGo 설치 안내를 보세요.`)
    + `<br><br>절예(Fine Art)는 공개 배포판이 없어 붙일 수 없습니다.`;
}

// ---------------------------------------------------------------- 조작
판.addEventListener("click", 사건 => {
  if (!상태 || 상태.끝남 || 생각중) return;
  if (상태.사람 !== null && 상태.차례 !== 상태.사람) return;
  const 상자 = 판.getBoundingClientRect();
  const 배율 = 판.width / 상자.width, 칸 = 여백();
  const x = (사건.clientX - 상자.left) * 배율;
  const y = (사건.clientY - 상자.top) * 배율;
  const 열 = Math.round(x / 칸) - 1, 행 = Math.round(y / 칸) - 1;
  if (행 < 0 || 열 < 0 || 행 >= 크기 || 열 >= 크기) return;
  후보수 = [];
  보내기("/api/play", { 행, 열 });
});

document.getElementById("패스").onclick = () => 보내기("/api/pass");
document.getElementById("무르기").onclick = () => 보내기("/api/undo", { 수: 2 });
document.getElementById("분석").onclick = () => 보내기("/api/analyze");
document.getElementById("돌던지기").onclick = () => {
  if (confirm("돌을 던집니다. 계속할까요?")) 보내기("/api/resign");
};
document.getElementById("계가").onclick = async () => {
  try {
    const 결과 = await 요청("/api/score", {});
    상태 = 결과;
    갱신();
    const 집 = 결과.집계산;
    alert(`${집.규칙}식 계가\n\n흑 ${집.흑}집\n백 ${집.백}집 (덤 ${집.덤})\n\n${집.결과}`);
  } catch (오류) { 알림(오류.message); }
};
document.getElementById("기보저장").onclick = () => { location.href = "/api/sgf"; };
document.getElementById("기보열기").onclick = () =>
  document.getElementById("파일").click();
document.getElementById("파일").onchange = 사건 => {
  const 파일 = 사건.target.files[0];
  if (!파일) return;
  const 읽개 = new FileReader();
  읽개.onload = () => 보내기("/api/load", { sgf: 읽개.result });
  읽개.readAsText(파일);
};
document.getElementById("새대국").onclick = () => {
  const 값 = id => document.getElementById(id).value;
  후보수 = [];
  보내기("/api/new", {
    크기: Number(값("크기")),
    엔진: 값("엔진"),
    사람: 값("내색"),
    접바둑: Number(값("접바둑")),
    규칙: 값("규칙"),
    생각시간: Number(값("생각시간")),
  });
};

document.getElementById("크기").onchange = 사건 => {
  크기 = Number(사건.target.value);
  그리기();
};

// 화면 크기에 맞춰 판을 키운다.
function 크기맞추기() {
  const 폭 = Math.min(680, window.innerWidth - 380, window.innerHeight - 90);
  const 최종 = Math.max(300, 폭);
  판.style.width = 최종 + "px";
  판.style.height = 최종 + "px";
}
window.addEventListener("resize", 크기맞추기);
크기맞추기();
그리기();
(async () => {
  try {
    상태 = await 요청("/api/state");
    후보수 = 상태.분석 || [];
    그리기(); 갱신();
  } catch (오류) { 알림(오류.message); }
})();
</script>
</body>
</html>
